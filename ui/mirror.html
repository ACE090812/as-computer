<!doctype html>
<html>
<head><meta charset="utf-8"><title>mirror</title>
<!-- Drawn on a monitor for players standing near someone using that computer: shows the latest picture of their
     screen (client/mirror.lua sends { img = 'data:image/jpeg;base64,...' } about once a second). -->
<style>html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; } img { display: block; width: 100%; height: 100%; object-fit: fill; }</style>
</head>
<body><img id="i" alt="">
<script>
window.addEventListener('message', function (e) {
  var d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { return; } }
  if (d && typeof d.img === 'string' && d.img.indexOf('data:image/') === 0) document.getElementById('i').src = d.img;
});
</script>
</body>
</html>
